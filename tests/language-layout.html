<!doctype html><html lang="en"><meta charset="utf-8"><title>ASCENT language layout check</title>
<style>body{font:14px system-ui;margin:16px;background:#eee}label{margin-right:14px}select,button{font:inherit;padding:8px}iframe{display:block;border:1px solid #888;margin:14px 0;background:white}pre{white-space:pre-wrap;max-width:900px}</style>
<h1>Language layout check</h1><p>Isolated preview: Firebase is disabled and browser storage is blocked.</p>
<label>Language <select id="language"><option>en</option><option>ja</option></select></label>
<label>Viewport <select id="size"><option>320×640</option><option>375×667</option><option>390×844</option><option>430×932</option></select></label>
<label>Screen <select id="screen"><option>settings</option><option>daily-settings</option><option>stage-settings</option><option>daily</option><option>stage-start</option><option>clear</option><option>daily-clear</option><option>failure</option><option>editor</option><option>reward</option><option>life</option><option>feature</option><option>title</option><option>transfer</option></select></label>
<button id="render">Render</button><pre id="report">Preparing…</pre><iframe id="preview" title="Game preview" sandbox="allow-scripts"></iframe>
<script>
const preview=document.getElementById('preview'),report=document.getElementById('report');
window.addEventListener('message',event=>{if(event.source===preview.contentWindow && event.data?.type==='layout')report.textContent=JSON.stringify(event.data,null,2);});
async function render(){
 const [width,height]=document.getElementById('size').value.split('×').map(Number),language=document.getElementById('language').value,screen=document.getElementById('screen').value;
 preview.width=width;preview.height=height;report.textContent='Preparing…';
 const root=new URL('../',location.href),markup=await fetch(new URL('index.html',root),{cache:'no-store'}).then(r=>r.text());
 const doc=new DOMParser().parseFromString(markup,'text/html');const base=doc.createElement('base');base.href=root.href;doc.head.prepend(base);
 doc.querySelector('script[src*="firebase-client.js"]').remove();
 const fixture=doc.createElement('script');fixture.textContent=`
 document.addEventListener('DOMContentLoaded',async()=>{
 try {
  setGameLanguage(${JSON.stringify(language)});titlePreparation++;cancelMapReveal();
  ui.titleScreen.hidden=true;ui.wall.classList.toggle('title-open',false);state='map';ui.levelMap.hidden=false;ui.levelMap.removeAttribute('aria-hidden');ui.wall.classList.toggle('map-open',true);renderLevelMap();
  playerName='ABCDEFGHIJ';stageProgress.existing.cleared=47;stageRecords.existing[47]={moves:18,timeMs:123456,stars:3,version:COURSE_VERSION};
  const screen=${JSON.stringify(screen)};
  if(screen==='settings')openSettings();
  else if(screen==='daily-settings'){showDailyCalendar();openSettings();}
  else if(screen==='stage-settings'){reset(1);cameraIntro=null;hideStageHelp();openSettings();}
  else if(screen==='daily'){showDailyCalendar();chooseDailyDate(localToday());}
  else if(screen==='stage-start')openStageStart(47);
  else if(screen==='editor')showCharacterEditor();
  else if(['clear','daily-clear','failure','feature'].includes(screen)){
   reset(1);cameraIntro=null;hideStageHelp();ui.levelMap.hidden=true;moveCount=18;runElapsedMs=123456;runStartedAt=null;
   if(screen==='daily-clear')dailyRun={...dailyProfile(localToday()),returnCourse:'existing'};
   if(screen==='feature'){pendingFeatureHelp=['hazard'];featureHelpOpen=true;renderStageHelp();ui.featureHelpDialog.showModal();}
   else {finish(screen!=='failure');if(screen!=='failure'){ui.resultStars.textContent='⭐️⭐️⭐️';ui.resultStars.setAttribute('aria-label',gameText('score.stars',{value0:3}));}ui.resultTipText.textContent=GAMEPLAY_TIPS.reduce((a,b)=>a.length>b.length?a:b);}
  }
  else if(screen==='reward'){ui.rewardResult.innerHTML=rewardResultMarkup({kind:'life',amount:0});ui.rewardResult.hidden=false;ui.rewardDialog.hidden=false;ui.rewardDialog.showModal();}
  else if(screen==='life'){lives.count=0;requestLifeStart(()=>{});}
  else if(screen==='title'||screen==='transfer'){
   state='choosing';ui.levelMap.hidden=true;ui.titleScreen.hidden=false;ui.wall.classList.toggle('title-open',true);ui.titleTap.hidden=false;
   if(screen==='transfer')ui.titleTransfer.onclick({stopPropagation(){}});
  }
  await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const issues=[],hidden=el=>!el.getClientRects().length || el.closest('[hidden]');
  for(const el of document.querySelectorAll('.audio-settings-row,input[type=range],button,h1,h2,.score-row,.score-status,.stage-start-heading,.result-heading,.daily-clear-record,.editor-actions,.daily-heading')){
   if(hidden(el)||el.classList.contains('map-node'))continue;const r=el.getBoundingClientRect(),style=getComputedStyle(el);
   if(r.left<-.5||r.right>innerWidth+.5)issues.push({kind:'viewport',id:el.id||el.className,text:el.textContent.trim(),left:r.left,right:r.right});
   if(el.scrollWidth>el.clientWidth+2 && !['hidden','clip'].includes(style.overflowX))issues.push({kind:'overflow',id:el.id||el.className,text:el.textContent.trim(),scroll:el.scrollWidth,client:el.clientWidth});
   if(el.tagName==='BUTTON'&&el.textContent.trim()){
    const range=document.createRange();range.selectNodeContents(el);const t=range.getBoundingClientRect();
    if(t.left<r.left-1||t.right>r.right+1)issues.push({kind:'button-text',id:el.id,text:el.textContent.trim(),textWidth:t.width,width:r.width});
   }
  }
  for(const row of document.querySelectorAll('.audio-settings-row')){
   if(hidden(row))continue;
   const toggle=row.querySelector('label').getBoundingClientRect(),slider=row.querySelector('input[type=range]').getBoundingClientRect();
   if(slider.width<60||slider.left<toggle.right-1||Math.abs((toggle.top+toggle.bottom-slider.top-slider.bottom)/2)>1)issues.push({kind:'audio-row',toggleWidth:toggle.width,sliderWidth:slider.width});
  }
  if(screen==='editor')for(const id of ['playerName','editorRandom','editorCancel','editorConfirm']){const r=document.getElementById(id).getBoundingClientRect();if(r.bottom>innerHeight||r.top<0)issues.push({kind:'editor-height',id,bottom:r.bottom});}
  parent.postMessage({type:'layout',language:${JSON.stringify(language)},screen,width:innerWidth,height:innerHeight,heading:document.querySelector('dialog[open] h1,dialog[open] h2')?.textContent,issues},'*');
 }catch(error){parent.postMessage({type:'layout',error:String(error),stack:error.stack},'*');}
 });`;
 doc.body.append(fixture);preview.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
}
document.getElementById('render').onclick=render;render();
</script></html>
