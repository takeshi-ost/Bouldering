<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ASCENT — クライミングパズル</title>
    <link rel="stylesheet" href="styles.css">
    <!-- classic scripts + defer: file:// で開いても実行でき、記載順に初期化します。 -->
    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/stage.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/input.js" defer></script>
    <script src="js/renderer.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <main>
        <header>
            <div>
                <div class="brand">ASCENT<span class="brand-dot">.</span></div>
                <div class="tag">ONE MOVE CLOSER.</div>
            </div>
            <div class="level" id="level">Level 1<span>BOULDERING PUZZLE</span></div>
        </header>
        <section class="wall" aria-label="クライミングゲーム">
            <canvas id="game" width="400" height="700" aria-label="緑の胴体をドラッグして黄色のゴールを目指してください"></canvas>
            <div class="hud">
                <div class="pill">STAMINA <strong id="stamina">8</strong></div>
                <div class="progress" id="progress">0 手 / 想定 5 手</div>
            </div>
            <div class="hint" id="hint" role="status">胴体を進みたい方向へドラッグ<br>1本を支点に固定し、他の3本が追従します</div>
            <div class="overlay" id="overlay" hidden>
                <div class="card">
                    <div class="eyebrow" id="resultTag"></div>
                    <h1 id="resultTitle"></h1>
                    <p id="resultText"></p>
                    <button id="next">NEXT STAGE →</button>
                    <button class="secondary" id="retry">RETRY</button>
                </div>
            </div>
        </section>
        <footer>
            <div class="legend">
                <span><i class="dot"></i>START</span>
                <span><i class="dot gold"></i>GOAL</span>
            </div>
            <button id="restart" aria-label="現在のステージを最初からやり直す">↻ RESTART</button>
        </footer>
        <div class="debug">
            <label><input id="showPath" type="checkbox" checked> 想定パスを表示</label>
            <small>青点線：参考コース / 数字：通過点</small>
        </div>
        <div class="density" id="density" aria-live="polite"></div>
    </main>
</body>
</html>
