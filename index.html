<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ASCENT — クライミングパズル</title>
    <link rel="stylesheet" href="styles.css">
    <!-- classic scripts + defer: file:// で開いても実行でき、記載順に初期化します。 -->
    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/stage.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/route.js" defer></script>
    <script src="js/prototype.js" defer></script>
    <script src="js/input.js" defer></script>
    <script src="js/renderer.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <main>
        <header>
            <div>
                <div class="title-row"><div class="brand">ASCENT<span class="brand-dot">.</span></div><label class="path-toggle"><input id="showPath" type="checkbox"> パス表示</label></div>
                <div class="tag">ONE MOVE CLOSER.</div>
            </div>
            <div class="level" id="level">Level 1<span>BOULDERING PUZZLE</span></div>
        </header>
        <section class="wall" aria-label="クライミングゲーム">
            <canvas id="game" width="400" height="700" aria-label="フィールドのどこからでもスワイプして黄色のゴールを目指してください"></canvas>
            <div id="scrollRail" class="scroll-rail" role="slider" tabindex="0" aria-label="ステージのスクロール" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                <div id="scrollThumb" class="scroll-thumb"><span>↕</span></div>
            </div>
            <div class="hud">
                <div class="pill">STAMINA <strong id="stamina">—</strong></div>
                <div class="progress" id="progress">0 手 / 準備中</div>
            </div>

            <div class="overlay course-picker" id="courseMenu">
                <div class="card">
                    <div class="eyebrow">ASCENT</div>
                    <h1>コースを選択</h1>
                    <p>どちらの壁に挑戦しますか？</p>
                    <button id="existingCourse">既存コース</button>
                    <button class="secondary" id="prototypeCourse">試作コース</button>
                    <p id="courseError" role="alert" hidden></p>
                </div>
            </div>
            <div class="overlay" id="overlay" hidden>
                <div class="card">
                    <div class="eyebrow" id="resultTag"></div>
                    <h1 id="resultTitle"></h1>
                    <p id="resultText"></p>
                    <button id="next">NEXT STAGE →</button>
                    <button class="secondary" id="retry">RETRY</button>
                </div>
            </div>
        </section>
        <footer>
            <div class="legend">
                <span><i class="dot"></i>START</span>
                <span><i class="dot gold"></i>GOAL</span>
                <span><i class="dot wide"></i>両手／両足</span>
            </div>
            <button id="undo" aria-label="直前の移動を1手取り消す" disabled>↶ UNDO</button>
            <button id="restart" aria-label="現在のステージを最初からやり直す">↻ RESTART</button>
        </footer>
        <div class="density" id="density" aria-live="polite"></div>
    </main>
</body>
</html>
